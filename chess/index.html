<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sri vs Rika ♟️</title><meta property="og:title" content="Sri vs Rika ♟️">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#312e2b;color:#fff;font-family:-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;align-items:center}
.bar{width:min(100vw,560px);display:flex;align-items:center;gap:10px;padding:10px 8px}
.av{width:34px;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-weight:700}
.name{font-weight:600}.sub{font-size:12px;color:#bababa}
#board{width:min(100vw,560px);height:min(100vw,560px);display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr);touch-action:none}
.sq{position:relative;display:flex;align-items:center;justify-content:center}
.l{background:#eeeed2}.d{background:#769656}
.sq img{width:92%;height:92%;pointer-events:none}
.sel.l,.last.l{background:#f6f669}.sel.d,.last.d{background:#baca2b}
.chk{background:radial-gradient(circle,#ff2020 0%,#e00 40%,transparent 80%)!important}
.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.18)}
.cap::after{content:"";position:absolute;inset:4%;border-radius:50%;border:5px solid rgba(0,0,0,.18)}
.co{position:absolute;font-size:10px;font-weight:700}.co.r{left:3px;top:2px}.co.f{right:3px;bottom:1px}
.l .co{color:#769656}.d .co{color:#eeeed2}
#status{min-height:22px;margin:6px;font-size:15px;color:#ddd;text-align:center}
.ctl{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:6px}
button,select{background:#81b64c;color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px;font-weight:700;box-shadow:0 4px 0 #45753c}
button.g{background:#4b4847;box-shadow:0 4px 0 #2b2927} select{background:#4b4847;box-shadow:none}
#moves{width:min(100vw,560px);padding:6px 10px;font-size:13px;color:#bbb;line-height:1.6}
#promo{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center}
#promo div{background:#fff;border-radius:10px;display:flex;padding:6px}#promo img{width:64px;height:64px}
#bubble{background:#fff;color:#222;border-radius:12px;padding:6px 10px;font-size:13px;margin-left:auto;max-width:55%;display:none}
</style></head><body>
<div class="bar"><div class="av" style="background:#e57ea6">R</div><div><div class="name">Rika 🌸</div><div class="sub" id="lvl">Easy</div></div><div id="bubble"></div></div>
<div id="board"></div>
<div class="bar"><div class="av" style="background:#5d9948">S</div><div><div class="name">Sri</div><div class="sub" id="col">White</div></div></div>
<div id="status">Your move</div>
<div class="ctl"><button id="nw">New game</button><select id="side"><option value="w">Play White</option><option value="b">Play Black</option><option value="r">Random</option></select><select id="diff"><option value="1">Easy</option><option value="6">Medium</option><option value="12">Hard</option></select><button class="g" id="undo">Undo</button></div>
<div id="moves"></div>
<div id="promo"><div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
<script>
const G=new Chess();let me='w',sel=null,last=null,busy=false,skill=1;
const B=document.getElementById('board'),S=document.getElementById('status');
let sf=null;try{sf=new Worker(URL.createObjectURL(new Blob(["importScripts('https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js')"],{type:'application/javascript'})));sf.postMessage('uci');}catch(e){}
const files='abcdefgh';
function say(t){const b=document.getElementById('bubble');b.textContent=t;b.style.display='block';clearTimeout(say.t);say.t=setTimeout(()=>b.style.display='none',3500)}
function sqName(i){const r=Math.floor(i/8),c=i%8;return me==='w'?files[c]+(8-r):files[7-c]+(r+1)}
function draw(){B.innerHTML='';const moves=sel?G.moves({square:sel,verbose:true}):[];
 for(let i=0;i<64;i++){const s=sqName(i),f=files.indexOf(s[0]),rk=+s[1];const d=document.createElement('div');
  d.className='sq '+((f+rk)%2?'l':'d');if(s===sel)d.classList.add('sel');if(last&&(s===last.from||s===last.to))d.classList.add('last');
  const p=G.get(s);if(p){const im=document.createElement('img');im.src='p/'+p.color+p.type.toUpperCase()+'.svg';d.appendChild(im);
   if(p.type==='k'&&p.color===G.turn()&&G.in_check())d.classList.add('chk');}
  const mv=moves.find(m=>m.to===s);if(mv)d.classList.add(p?'cap':'dot');
  if(i%8===0){const c=document.createElement('span');c.className='co r';c.textContent=s[1];d.appendChild(c)}
  if(i>=56){const c=document.createElement('span');c.className='co f';c.textContent=s[0];d.appendChild(c)}
  d.onclick=()=>tap(s);B.appendChild(d)}
 const h=G.history();let t='';for(let i=0;i<h.length;i+=2)t+=(i/2+1)+'. '+h[i]+' '+(h[i+1]||'')+'  ';document.getElementById('moves').textContent=t;
 status()}
function status(){if(G.in_checkmate()){S.textContent=G.turn()===me?'Checkmate. Rika wins 😈':'Checkmate! You win Sri 🎉';say(G.turn()===me?'GG! Rematch? 😈':'Okay okay, you got me 😭');return}
 if(G.in_draw()||G.in_stalemate()||G.in_threefold_repetition()){S.textContent='Draw 🤝';return}
 S.textContent=G.turn()===me?(G.in_check()?'Check! Your move':'Your move'):'Rika is thinking...'}
function tap(s){if(busy||G.game_over()||G.turn()!==me)return;const p=G.get(s);
 if(sel){const mv=G.moves({square:sel,verbose:true}).find(m=>m.to===s);
  if(mv){if(mv.flags.includes('p')){promo(sel,s);return}do_(sel,s,'q');return}}
 sel=(p&&p.color===me)?s:null;draw()}
function promo(f,t){const P=document.getElementById('promo'),dv=P.firstChild;dv.innerHTML='';
 for(const x of'qrbn'){const im=document.createElement('img');im.src='p/'+me+x.toUpperCase()+'.svg';im.onclick=()=>{P.style.display='none';do_(f,t,x)};dv.appendChild(im)}P.style.display='flex'}
function do_(f,t,pr){const m=G.move({from:f,to:t,promotion:pr});if(!m)return;sel=null;last=m;if(m.captured==='q')say('My queen?! 😤');if(G.in_check())say('Check?! Rude 😳');save();draw();if(!G.game_over())rika()}
function rika(){busy=true;S.textContent='Rika is thinking...';
 if(sf){sf.onmessage=e=>{const l=String(e.data);if(l.startsWith('bestmove')){const u=l.split(' ')[1];
   const m=G.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]||'q'});busy=false;if(m){last=m;if(m.captured==='q')say('Yoink 👑');else if(G.in_check())say('Check 😈')}save();draw()}};
  sf.postMessage('setoption name Skill Level value '+skill);sf.postMessage('position fen '+G.fen());sf.postMessage('go movetime '+(skill>6?600:150));}
 else{const ms=G.moves();const m=G.move(ms[Math.floor(Math.random()*ms.length)]);last=m;busy=false;save();draw()}}
function save(){localStorage.rika=JSON.stringify({pgn:G.pgn(),me,skill})}
function newGame(){G.reset();sel=null;last=null;busy=false;let v=document.getElementById('side').value;me=v==='r'?(Math.random()<.5?'w':'b'):v;
 skill=+document.getElementById('diff').value;document.getElementById('lvl').textContent=document.getElementById('diff').selectedOptions[0].text;
 document.getElementById('col').textContent=me==='w'?'White':'Black';save();draw();say("Let's go Sri! 🌸");if(me==='b')rika()}
document.getElementById('nw').onclick=newGame;
document.getElementById('undo').onclick=()=>{if(busy)return;G.undo();if(G.turn()!==me)G.undo();last=null;sel=null;save();draw()};
document.getElementById('diff').onchange=e=>{skill=+e.target.value;document.getElementById('lvl').textContent=e.target.selectedOptions[0].text;save()};
try{const o=JSON.parse(localStorage.rika||'null');if(o&&o.pgn){G.load_pgn(o.pgn);me=o.me;skill=o.skill;document.getElementById('side').value=me;document.getElementById('diff').value=skill;
 document.getElementById('col').textContent=me==='w'?'White':'Black';document.getElementById('lvl').textContent=document.getElementById('diff').selectedOptions[0].text}}catch(e){}
draw();if(G.turn()!==me&&!G.game_over())rika();
</script></body></html>
